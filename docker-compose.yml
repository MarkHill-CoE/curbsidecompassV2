services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parking-policy-simulator
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
