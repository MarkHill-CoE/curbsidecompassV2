<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Prismatic Honeycomb Cell Pattern calibrated to #FFC72C -->
    <pattern id="sm-honeycomb" width="48" height="83.14" patternUnits="userSpaceOnUse">
      <g stroke="#E0A812" stroke-width="1.2" fill="none" opacity="0.45">
        <!-- Interlocking Hexagons -->
        <path d="M 24,0 L 48,13.86 L 48,41.57 L 24,55.43 L 0,41.57 L 0,13.86 Z" />
        <path d="M 0,55.43 L 24,69.28 L 24,97 L 0,110.86 L -24,97 L -24,69.28 Z" />
        <path d="M 48,55.43 L 72,69.28 L 72,97 L 48,110.86 L 24,97 L 24,69.28 Z" />
        <!-- Micro-prism Facets for authentic retroreflective 3D shine -->
        <path d="M 24,27.71 L 24,0 M 24,27.71 L 48,41.57 M 24,27.71 L 0,41.57" stroke="#FFDE6E" stroke-width="0.9" opacity="0.6" />
        <path d="M 48,83.14 L 48,55.43 M 48,83.14 L 72,97 M 48,83.14 L 24,97" stroke="#FFDE6E" stroke-width="0.9" opacity="0.6" />
        <path d="M 0,83.14 L 0,55.43 M 0,83.14 L 24,97 M 0,83.14 L -24,97" stroke="#FFDE6E" stroke-width="0.9" opacity="0.6" />
      </g>
      <!-- Specular Retroreflective Highlight Nodes -->
      <circle cx="24" cy="27.71" r="1.5" fill="#FFFFFF" opacity="0.75" />
      <circle cx="0" cy="83.14" r="1.5" fill="#FFFFFF" opacity="0.75" />
      <circle cx="48" cy="83.14" r="1.5" fill="#FFFFFF" opacity="0.75" />
    </pattern>

    <!-- Exact Edmonton Yellow Base matching header 'Compass' text (#FFC72C) -->
    <radialGradient id="sm-yellow-base" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FFD452" />
      <stop offset="45%" stop-color="#FFC72C" />
      <stop offset="85%" stop-color="#F7BE20" />
      <stop offset="100%" stop-color="#EDAE12" />
    </radialGradient>

    <!-- Clean Ambient Sheen -->
    <linearGradient id="sm-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#FFC72C" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#A56E00" stop-opacity="0.15" />
    </linearGradient>

    <!-- Compass Mask with Cutouts -->
    <mask id="sm-compass-mask">
      <rect width="1000" height="1000" fill="black" />
      
      <!-- Compass Legs & Top Hinge (with Center Cutout & Negative Spaces) -->
      <path fill="white" fill-rule="evenodd" d="
        M 500,0
        A 185,185 0 0,1 655,260
        L 760,520
        L 585,520
        A 415,415 0 0,1 365,600
        L 415,520
        L 500,360
        Z
        M 500,120
        A 65,65 0 1,0 500,250
        A 65,65 0 1,0 500,120
        Z
      " />
      
      <!-- Left Leg with Wing and Pointed Tip -->
      <path fill="white" d="
        M 500,0
        A 185,185 0 0,0 345,260
        L 195,500
        C 130,470 48,485 48,515
        C 48,540 100,560 115,575
        L 0,930
        L 55,980
        L 140,920
        L 345,775
        L 365,600
        L 415,520
        L 500,360
        Z
      " />

      <!-- Measuring Arc Sweeping Right -->
      <path fill="white" d="
        M 365,600
        A 415,415 0 0,0 875,435
        C 915,465 955,490 952,525
        C 948,560 900,600 870,630
        A 590,590 0 0,1 345,775
        Z
      " />

      <!-- Detached Right Foot Block -->
      <path fill="white" d="
        M 745,790
        L 920,690
        L 1000,830
        L 865,980
        Z
      " />
    </mask>
  </defs>

  <g mask="url(#sm-compass-mask)">
    <!-- Base Color -->
    <rect width="1000" height="1000" fill="url(#sm-yellow-base)" />
    <!-- Prismatic Honeycomb Sheeting -->
    <rect width="1000" height="1000" fill="url(#sm-honeycomb)" />
    <!-- Sheen Highlight -->
    <rect width="1000" height="1000" fill="url(#sm-sheen)" />
  </g>
</svg>
